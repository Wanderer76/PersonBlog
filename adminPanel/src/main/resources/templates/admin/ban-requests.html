<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление жалобами на посты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .ban-form {
            display: none;
            margin-top: 10px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #dc3545;
        }
        .request-card {
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .request-header {
            background-color: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
        }
        .request-body {
            padding: 15px;
        }
        .request-actions {
            padding: 15px;
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
        }
        .pagination-container {
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <!-- Заголовок -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">
                    <i class="fas fa-ban me-2"></i>Управление жалобами на посты
                </h1>
                <div class="btn-group">
                    <a th:href="@{/admin/posts/ban-requests}" class="btn btn-outline-primary">
                        <i class="fas fa-sync-alt me-1"></i>Обновить
                    </a>
                </div>
            </div>

            <!-- Статистика -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card stats-card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <h5 class="card-title">Всего жалоб</h5>
                                    <h2 class="display-4" th:text="${totalCount}">0</h2>
                                </div>
                                <div class="col-md-6 d-flex align-items-center justify-content-end">
                                    <i class="fas fa-exclamation-triangle fa-4x opacity-50"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Список жалоб -->
            <div th:if="${totalCount == 0}">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>Нет жалоб для обработки
                </div>
            </div>

            <div th:each="request : ${banRequests}" class="request-card">
                <div class="request-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">
                            <i class="fas fa-flag text-danger me-2"></i>
                            Жалоба #<span th:text="${request.id}"></span>
                        </h6>
                        <span class="badge bg-secondary">
                                <i class="fas fa-clock me-1"></i>
                                <span th:text="${#temporals.format(request.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                            </span>
                    </div>
                </div>

                <div class="request-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-2 redirectable" th:attr="data-post-id=${request.postId}">
                                <strong>ID поста:</strong>
                                <code th:text="${request.postId}"></code>
                            </div>
                            <div class="mb-2">
                                <strong>Название:</strong>
                                <span th:text="${request.title}"></span>
                            </div>
                            <div class="mb-2">
                                <strong>ID причины:</strong>
                                <span th:text="${request.reasonId}"></span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-2">
                                <strong>Сообщение пользователя:</strong>
                                <p th:text="${request.userMessage != null ? request.userMessage : 'Нет сообщения'}"
                                   class="text-muted"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="request-actions">
                    <div class="d-flex gap-2">
                        <button class="btn btn-danger btn-sm"
                                onclick="toggleBanForm(this)"
                                data-post-id="${request.postId}">
                            <i class="fas fa-ban me-1"></i>Забанить
                        </button>

                        <form th:action="@{/api/post/restoreFromBan}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('Вы уверены, что хотите восстановить этот пост?')">
                            <input type="hidden" name="postId" th:value="${request.postId}"/>
                            <input type="hidden" name="message" value=""/>
                            <button type="submit" class="btn btn-success btn-sm">
                                <i class="fas fa-undo me-1"></i>Восстановить
                            </button>
                        </form>
                    </div>

                    <!-- Форма для бана -->
                    <div class="ban-form mt-3">
                        <form th:action="@{/api/post/sendToBan}" method="post">
                            <input type="hidden" name="postId" th:value="${request.postId}"/>

                            <div class="mb-2">
                                <label for="message" class="form-label">
                                    <i class="fas fa-comment me-1"></i>Причина бана:
                                </label>
                                <textarea name="message" class="form-control" rows="3"
                                          placeholder="Введите причину бана..." required></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-check me-1"></i>Подтвердить бан
                                </button>
                                <button type="button" class="btn btn-secondary btn-sm"
                                        onclick="toggleBanForm(this)">
                                    <i class="fas fa-times me-1"></i>Отмена
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Пагинация -->
            <div th:if="${totalPages > 1}" class="pagination-container">
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center">
                        <!-- Previous page -->
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-link"
                               th:href="@{'/admin/posts/ban-requests?page=' + (currentPage - 1) + '&size=' + pageSize}">
                                <i class="fas fa-chevron-left"></i>
                            </a>
                        </li>

                        <!-- Page numbers -->
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            class="page-item" th:classappend="${i == currentPage} ? 'active' : ''">
                            <a class="page-link"
                               th:href="@{'/admin/posts/ban-requests?page=' + i + '&size=' + pageSize}"
                               th:text="${i + 1}"></a>
                        </li>

                        <!-- Next page -->
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                            <a class="page-link"
                               th:href="@{'/admin/posts/ban-requests?page=' + (currentPage + 1) + '&size=' + pageSize}">
                                <i class="fas fa-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>

                <div class="text-center text-muted mt-2">
                    Показано <span th:text="${banRequests.size()}"></span> из
                    <span th:text="${totalCount}"></span> жалоб
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleBanForm(button) {
        const form = button.closest('.request-actions').querySelector('.ban-form');
        const isVisible = form.style.display === 'block';

        // Скрываем все открытые формы
        document.querySelectorAll('.ban-form').forEach(f => {
            f.style.display = 'none';
        });

        // Показываем/скрываем текущую форму
        form.style.display = isVisible ? 'none' : 'block';
    }

    // Обработка успешных действий
    function showSuccess(message) {
        // Можно добавить toast-уведомления
        alert(message);
        window.location.reload();
    }

    // Обработка ошибок
    function showError(message) {
        alert('Ошибка: ' + message);
    }
document.querySelectorAll('.redirectable').forEach(element => {
    element.addEventListener('click', function() {
        var postId = this.getAttribute('data-post-id');
    window.open('http://localhost:3000/video/' + postId, '_blank')
    });
});


    // Перехват форм для AJAX отправки (опционально)
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const formData = new FormData(this);
                const action = this.action;
                const method = this.method;

                try {
                    const response = await fetch(action, {
                        method: method,
                        body: new URLSearchParams(formData),
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        }
                    });

                    if (response.ok) {
                        showSuccess('Действие выполнено успешно');
                    } else {
                        showError('Ошибка сервера');
                    }
                } catch (error) {
                    showError('Сетевая ошибка');
                }
            });
        });
    });
</script>
</body>
</html>
